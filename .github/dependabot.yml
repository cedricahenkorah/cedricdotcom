version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Accra
    open-pull-requests-limit: 10
    ignore:
      # Astro check requires the TypeScript 5/6 compiler API.
      - dependency-name: typescript
        versions: [">=7.0.0"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Africa/Accra
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
